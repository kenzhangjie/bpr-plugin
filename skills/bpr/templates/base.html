<!--
  BPR base template · v4 (2026-05-07)
  ───────────────────────────────────────────────────────────────────────
  COPY THIS WHOLE FILE. Replace {{...}} placeholders. Do NOT redesign.
  Layout, font sizes, color palette, DOM structure are ALL battle-tested
  (5 layout regressions were paid for) — see references/lessons-learned.md
  if curious why each rule exists.

  Required DOM invariants (will break if violated):
  1. .theme-toggle, .toc-mobile, .toc-overlay, nav.toc are <body> direct
     children. They are NOT inside .container.
  2. .container holds only: .hero / .tldr / .chapter (×N) / footer.
  3. All mobile-only elements have base `display:none`, flipped on in
     @media(max-width:1099px).

  Replaceable placeholders — each appears in the body wrapped in double
  braces. The braces are omitted in this list on purpose: a renderer that
  fills placeholders with a plain string replace would otherwise fill them
  HERE too, duplicating the whole document inside this comment.
    LANG        zh-CN
    TITLE       page title
    HERO        full <header class="hero"> contents (kicker / h1 / .hero-zh / .hero-lede / .hero-meta)
    TLDR_LABEL  fixed string: TL;DR · 速读
    TLDR_H2     descriptive theme (NOT "X 条来自...")
    TLDR_ITEMS  one or more <li> per "每条 TL;DR 格式" in rules.md
    TOC_ITEMS   one <li><a href="#chN">NN · descriptive title</a></li> per chapter
    CHAPTERS    full chapter <section>s — see CHAPTER TEMPLATE block at bottom
    FOOTER      footer block
    TOC_ITEMS appears TWICE in the body (mobile overlay + desktop rail);
    every other placeholder appears exactly once.
-->
<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── design tokens ──────────────────────────────────────────── */
    :root{
      --paper:#f5efe4; --ink:#2a2520; --ink-soft:#5c554c; --ink-faint:#8a8278;
      --rule:#c9bfae; --accent:#b04a2f; --accent-soft:#d68a72;
      --serif-en:'Playfair Display',Georgia,serif;
      --serif-en-body:'Newsreader',Georgia,serif;
      --serif-zh:'Noto Serif SC',-apple-system,'PingFang SC',serif;
      --sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    [data-theme="dark"]{
      --paper:#1a1612; --ink:#e8dfd1; --ink-soft:#b5ac9e; --ink-faint:#7a7264;
      --rule:#3a3128; --accent:#e07050; --accent-soft:#a85b3f;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--paper); color:var(--ink);
      font-family:var(--serif-zh); line-height:1.7;
      -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
    }
    a{color:var(--accent); text-decoration:none;
      border-bottom:1px dotted var(--accent-soft); transition:border-color .15s}
    a:hover{border-bottom-color:var(--accent); border-bottom-style:solid}

    /* ── floating buttons (body children, NOT in .container) ─────── */
    .theme-toggle,.toc-mobile{
      position:fixed; z-index:50; width:40px; height:40px;
      border:1px solid var(--rule); border-radius:50%;
      background:var(--paper); color:var(--ink-soft);
      font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .15s;
    }
    .theme-toggle{top:20px; right:20px}
    .theme-toggle:hover,.toc-mobile:hover{color:var(--accent); border-color:var(--accent-soft)}

    /* mobile-only: base display:none — see lessons-learned.md */
    .toc-mobile{display:none; top:20px; left:20px}
    .toc-overlay{display:none; position:fixed; inset:0; z-index:45;
      background:rgba(0,0,0,.4); backdrop-filter:blur(4px)}
    .toc-overlay.open{display:block}
    .toc-overlay nav.toc{
      position:absolute; top:0; left:0; bottom:0; width:280px;
      background:var(--paper); padding:60px 24px 24px;
      overflow-y:auto; border-right:1px solid var(--rule);
    }

    /* ── desktop TOC (body child, position:fixed) ──────────────── */
    nav.toc{
      position:fixed; left:24px; top:80px; width:240px;
      max-height:calc(100vh - 120px); overflow-y:auto;
      font-family:var(--sans); font-size:13.5px; line-height:1.45;
      display:none;
    }
    @media(min-width:1100px){ nav.toc{display:block} }
    nav.toc .toc-label{
      font-family:var(--sans); font-size:11px; letter-spacing:.22em;
      text-transform:uppercase; color:var(--ink-faint);
      margin-bottom:14px; padding-left:14px;
    }
    nav.toc ul{list-style:none; margin:0; padding:0}
    nav.toc li{margin:0; border-left:3px solid transparent}
    nav.toc li:has(a.active){
      border-left-color:var(--accent);
    }
    nav.toc a{
      display:block; padding:6px 14px; margin:1px 0;
      color:var(--ink-soft); border-bottom:none;
      transition:color .15s;
    }
    nav.toc a:hover{color:var(--accent); border-bottom:none}
    nav.toc a.active{color:var(--accent); font-weight:500}

    /* ── container ─────────────────────────────────────────────── */
    .container{
      max-width:780px; margin:0 auto;
      padding:60px 28px 120px;
    }
    @media(min-width:1100px){
      .container{ max-width:780px; margin-left:260px; margin-right:auto; }
    }
    @media(min-width:1600px){
      .container{ margin-left:300px }
    }

    /* ── hero ──────────────────────────────────────────────────── */
    .hero{margin-bottom:80px}
    .hero-eyebrow{
      font-family:var(--sans); font-size:12px; letter-spacing:.18em;
      text-transform:uppercase; color:var(--ink-faint);
      margin-bottom:28px;
    }
    .hero h1{
      font-family:var(--serif-en); font-weight:700;
      font-size:54px; line-height:1.08; margin:0 0 14px;
      color:var(--ink);
    }
    .hero h1 em{font-style:italic; color:var(--accent)}
    @media(max-width:768px){ .hero h1{font-size:38px} }
    .hero-zh{
      font-family:var(--serif-zh); font-weight:500;
      font-size:22px; color:var(--ink-soft); margin-bottom:22px;
    }
    .hero-lede{
      font-family:var(--serif-zh); font-style:italic;
      font-size:18px; color:var(--ink-soft);
      border-left:2px solid var(--rule); padding-left:18px;
      margin:24px 0;
    }
    .hero-lede em{font-family:var(--serif-en-body); font-size:15px; font-style:italic}
    .hero-meta{
      font-family:var(--sans); font-size:13px; color:var(--ink-faint);
      margin-top:30px;
    }

    /* ── TL;DR ─────────────────────────────────────────────────── */
    .tldr{
      margin:60px 0 80px; padding:36px 0;
      border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
    }
    .tldr-label{
      font-family:var(--sans); font-size:11px; letter-spacing:.22em;
      text-transform:uppercase; color:var(--ink-faint);
      margin-bottom:10px;
    }
    .tldr h2{
      font-family:var(--serif-en); font-weight:700;
      font-size:32px; line-height:1.15; margin:0 0 28px;
    }
    .tldr ol{list-style:none; counter-reset:tldr; margin:0; padding:0}
    .tldr li{display:flex; flex-direction:column; 
      counter-increment:tldr; position:relative;
      padding:18px 0 18px 44px; border-top:1px dashed var(--rule);
    }
    .tldr li:first-child{border-top:none}
    .tldr li::before{
      content:counter(tldr,decimal-leading-zero);
      position:absolute; left:0; top:20px;
      font-family:var(--sans); font-size:13px; font-weight:500;
      color:var(--accent); letter-spacing:.05em;
    }
    .tldr-claim{
      order:2;
      font-family:var(--serif-zh); font-weight:500; font-style:italic;
      font-size:16px; color:var(--ink); margin:0 0 10px; line-height:1.6;
    }
    .tldr-quote{
      order:1;
      font-family:var(--serif-en-body); font-weight:600; font-style:normal;
      font-size:17px; color:var(--ink);
      margin:0 0 9px; line-height:1.5;
    }
    .tldr-context{
      order:3;
      font-family:var(--serif-en-body); font-size:13.5px;
      color:var(--ink-faint); line-height:1.55;
      margin:0 0 8px; padding-left:14px;
      border-left:1px dotted var(--rule);
    }
    .tldr-explain{
      order:4;
      font-family:var(--serif-zh); font-size:14.5px;
      color:var(--ink-soft); line-height:1.6; margin:0;
    }

    /* ── chapter ──────────────────────────────────────────────── */
    .chapter{margin:80px 0; scroll-margin-top:40px}
    .ch-num{
      font-family:var(--sans); font-size:11px; letter-spacing:.22em;
      text-transform:uppercase; color:var(--accent);
      margin-bottom:14px;
    }
    .chapter h2{
      font-family:var(--serif-en); font-weight:700;
      font-size:34px; line-height:1.15; margin:0 0 10px;
    }
    .ch-zh{
      font-family:var(--serif-zh); font-weight:500;
      font-size:20px; color:var(--ink-soft); margin-bottom:14px;
    }
    .ch-range,.chapter-meta{
      font-family:var(--sans); font-size:12px;
      color:var(--ink-faint); margin-bottom:36px;
      letter-spacing:.04em;
    }

    /* ── body content (essay mode) ─────────────────────────────── */
    .body-block{margin:24px 0}
    .bilingual{
      margin:18px 0; padding-left:14px;
      border-left:2px solid var(--rule);
    }
    .bilingual .en{
      font-family:var(--serif-en-body); font-style:italic;
      font-size:16.5px; color:var(--ink-soft);
      line-height:1.65; margin:0 0 10px;
    }
    .bilingual .zh{
      font-family:var(--serif-zh); font-size:16.5px;
      color:var(--ink); line-height:1.75; margin:0;
    }
    .bilingual a{font-style:normal}

    /* ── source images (essay/blog mode, self-hosted) ─────────────── */
    /* injected by scripts/extract_images.py → images/<stem>/NN_slug.ext */
    figure.from-source{margin:32px 0; text-align:center}
    figure.from-source img{
      max-width:100%; height:auto; display:block; margin:0 auto;
      border-radius:6px; border:1px solid var(--rule); background:#fff;
    }
    [data-theme="dark"] figure.from-source img{border-color:var(--rule); background:#0d0a07}
    figure.from-source.banner img{width:100%}
    figure.from-source.wide img{max-width:100%}
    figure.from-source.square img{max-width:420px}
    figure.from-source.portrait img{max-width:340px}
    figure.from-source figcaption{
      font-family:var(--sans); font-size:12.5px; color:var(--ink-faint);
      margin-top:8px; line-height:1.5;
    }

    /* ── turn (podcast mode) ──────────────────────────────────── */
    .turn{margin:28px 0}
    .turn-head{
      display:flex; align-items:baseline; gap:12px;
      margin-bottom:10px;
    }
    .speaker{
      font-family:var(--sans); font-size:12px; font-weight:600;
      letter-spacing:.04em; color:var(--accent);
    }
    .speaker[data-role="host"]{color:var(--ink-soft)}
    .timestamp{
      font-family:var(--sans); font-size:11px;
      color:var(--ink-faint); letter-spacing:.05em;
    }
    .turn-body{padding-left:0}

    /* ── callout / pull-quote ─────────────────────────────────── */
    .callout{
      margin:32px 0; padding:20px 24px;
      background:rgba(176,74,47,.05);
      border-left:3px solid var(--accent);
      font-family:var(--serif-zh); font-size:15.5px;
      color:var(--ink-soft); line-height:1.7;
    }
    [data-theme="dark"] .callout{ background:rgba(224,112,80,.08) }
    .pull{
      font-family:var(--serif-en-body); font-style:italic;
      font-size:24px; line-height:1.35;
      margin:36px 0; padding:0 0 0 20px;
      border-left:3px solid var(--accent);
      color:var(--ink);
    }

    /* ── Chinese-only mode: contrarian section + chapter summary ─ */
    /* 中文模式特有:🔥 非共识 takes / 章节浓缩摘要 / TL;DR 简化版型 */
    .contrarian{
      margin:60px 0 80px; padding:36px 0;
      border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
    }
    .contrarian-label{
      font-family:var(--sans); font-size:11px; letter-spacing:.22em;
      text-transform:uppercase; color:var(--accent);
      margin-bottom:10px;
    }
    .contrarian h2{
      font-family:var(--serif-zh); font-weight:700;
      font-size:30px; line-height:1.2; margin:0 0 32px;
      color:var(--ink);
    }
    .contrarian-item{
      counter-increment:contra;
      position:relative;
      padding:22px 0 22px 44px;
      border-top:1px dashed var(--rule);
    }
    .contrarian-item:first-of-type{border-top:none}
    .contrarian-item::before{
      content:counter(contra,decimal-leading-zero);
      position:absolute; left:0; top:24px;
      font-family:var(--sans); font-size:13px; font-weight:500;
      color:var(--accent); letter-spacing:.05em;
    }
    .contrarian{counter-reset:contra}
    .contrarian-quote{
      font-family:var(--serif-zh); font-weight:600;
      font-size:18px; color:var(--ink);
      line-height:1.65; margin:0 0 12px;
      border-left:3px solid var(--accent); padding-left:16px;
    }
    .contrarian-why{
      font-family:var(--serif-zh); font-size:14.5px;
      color:var(--ink-soft); line-height:1.7; margin:0;
    }
    .contrarian-why strong{color:var(--accent); font-weight:600}

    /* 中文模式章节正文(浓缩摘要,不是双语对照)*/
    .ch-summary{
      font-family:var(--serif-zh); font-size:16px;
      color:var(--ink); line-height:1.85;
      margin:24px 0;
    }
    .ch-summary p{margin:0 0 14px}
    .ch-pull{
      font-family:var(--serif-zh); font-style:italic;
      color:var(--accent); font-weight:500;
      display:block; padding:8px 0 8px 16px;
      border-left:2px solid var(--accent-soft);
      margin:12px 0;
    }

    /* 中文模式 TL;DR 简化:只有 claim + explain,没有 quote / context 双语三明治 */
    .tldr.zh-only .tldr-quote,
    .tldr.zh-only .tldr-context{display:none}

    /* 全局中文模式标记(可选,放在 body 上方便整体调整)*/
    body[data-mode="zh-only"] .bilingual{display:none}

    /* ── CLEAN 阶段:可折叠逐字底档 + 存疑标注 ── */
    details.raw-transcript{margin:24px 0 8px; border-top:1px dashed var(--rule)}
    details.raw-transcript summary{
      font-family:var(--sans); font-size:12.5px; letter-spacing:.04em;
      color:var(--ink-faint); cursor:pointer; padding:10px 0; list-style:none;
    }
    details.raw-transcript summary::before{content:"▸ "; color:var(--accent)}
    details.raw-transcript[open] summary::before{content:"▾ "}
    details.raw-transcript .turn{opacity:.85}
    mark.asr-uncertain{
      background:transparent; color:var(--accent);
      border-bottom:1px dotted var(--accent-soft); cursor:help;
    }

    /* ── code ─────────────────────────────────────────────────── */
    code{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:.88em;
      background:rgba(176,74,47,.08); color:var(--accent);
      padding:1px 6px; border-radius:4px; white-space:nowrap;
    }
    [data-theme="dark"] code{background:rgba(224,112,80,.14)}
    pre{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:13.5px; line-height:1.55;
      background:var(--paper); color:var(--ink);
      padding:16px 18px; border-radius:8px; overflow-x:auto;
      border:1px solid var(--rule); margin:18px 0;
    }
    pre code{background:transparent; color:inherit; padding:0; white-space:pre}

    /* ── footer ───────────────────────────────────────────────── */
    footer{
      margin-top:120px; padding-top:36px;
      border-top:1px solid var(--rule);
      font-family:var(--sans); font-size:12px;
      color:var(--ink-faint); line-height:1.7;
    }

    /* ── mobile breakpoint ────────────────────────────────────── */
    @media(max-width:1099px){
      .toc-mobile{display:flex}
      .container{padding:80px 24px 100px}
    }

    /* ── print ────────────────────────────────────────────────── */
    @media print{
      .theme-toggle,.toc-mobile,nav.toc,.toc-overlay{display:none !important}
      .container{margin:0; max-width:none; padding:20px}
      .chapter{break-inside:avoid; page-break-inside:avoid}
      a{color:var(--ink); border-bottom:none}
    }
  </style>
</head>
<body>

  <!-- floating buttons: body direct children -->
  <button class="theme-toggle" aria-label="切换主题">◐</button>
  <button class="toc-mobile" aria-label="目录" id="tocBtn">☰</button>

  <!-- mobile TOC overlay: body direct child -->
  <div class="toc-overlay" id="tocOverlay">
    <nav class="toc">
      <div class="toc-label">Contents · 目录</div>
      <ul>{{TOC_ITEMS}}</ul>
    </nav>
  </div>

  <!-- desktop TOC: body direct child, position:fixed -->
  <nav class="toc">
    <div class="toc-label">Contents · 目录</div>
    <ul>{{TOC_ITEMS}}</ul>
  </nav>

  <!-- main content container -->
  <div class="container">

    <header class="hero">
      {{HERO}}
    </header>

    <section class="tldr">
      <div class="tldr-label">{{TLDR_LABEL}}</div>
      <h2>{{TLDR_H2}}</h2>
      <ol>{{TLDR_ITEMS}}</ol>
    </section>

    {{CHAPTERS}}

    <footer>
      {{FOOTER}}
    </footer>

  </div>

  <script>
    // theme toggle
    (function(){
      var t=document.querySelector('.theme-toggle');
      var saved=localStorage.getItem('bpr-theme');
      if(saved){document.documentElement.dataset.theme=saved}
      t.addEventListener('click',function(){
        var cur=document.documentElement.dataset.theme;
        var next=cur==='dark'?'light':'dark';
        document.documentElement.dataset.theme=next;
        localStorage.setItem('bpr-theme',next);
      });
    })();

    // mobile TOC toggle
    (function(){
      var btn=document.getElementById('tocBtn');
      var overlay=document.getElementById('tocOverlay');
      if(!btn||!overlay) return;
      btn.addEventListener('click',function(){overlay.classList.toggle('open')});
      overlay.addEventListener('click',function(e){
        if(e.target===overlay||e.target.tagName==='A') overlay.classList.remove('open');
      });
    })();

    // TOC scroll spy
    (function(){
      var links=document.querySelectorAll('nav.toc a[href^="#"]');
      if(!links.length) return;
      var sections=Array.from(links).map(function(a){
        return document.getElementById(a.getAttribute('href').slice(1));
      }).filter(Boolean);
      function update(){
        var y=window.scrollY+120;
        var active=sections[0];
        for(var i=0;i<sections.length;i++){
          if(sections[i].offsetTop<=y) active=sections[i];
        }
        links.forEach(function(a){
          a.classList.toggle('active',a.getAttribute('href')==='#'+active.id);
        });
      }
      window.addEventListener('scroll',update,{passive:true});
      update();
    })();
  </script>

<!-- 划线收藏(mark.ken.solar)。放在模板里而不是发布后注入,否则重渲染会把它冲掉。 -->
<script src="https://mark.ken.solar/embed.js?v=1" defer></script>
</body>
</html>

  CHUNKED-WRITE MODE (HTML > 30KB):

  ════════════════════════════════════════════════════════════════════
  CHINESE-ONLY MODE (CJK ≥ 60% auto-detected)
  ════════════════════════════════════════════════════════════════════
  See references/rules.md "中文模式 (Chinese-Only Mode)" for full spec.

  1. Add `data-mode="zh-only"` on <body> tag:
     <body data-mode="zh-only">
     (CSS rule auto-hides any leftover .bilingual blocks.)

  2. TL;DR — add `zh-only` class to .tldr, items have only claim + explain:
