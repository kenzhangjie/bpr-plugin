name: Feature request
description: 想新增一个功能或修饰词
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 不要直接讲方案。先讲问题。
      placeholder: "我经常想..., 但 BPR 现在做不到 / 做得不好,因为..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你想到的方案
      description: 可选。你自己设想的 API / 修饰词 / 输出形态。
      placeholder: |
        - 加修饰词 `精简` → 中文段落只输出关键句,跳过填充
        - 命令格式:`/bpr <url> 精简`
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现在你怎么 workaround 的?
  - type: textarea
    id: example
    attributes:
      label: 示例
      description: 一个具体的 input → expected output 示例。
      placeholder: |
        Input: "/bpr https://lennys-podcast.com/xxx 精简"
        Expected: TL;DR 部分只 5 条,正文跳过 q&a 段...
