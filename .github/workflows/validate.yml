name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Validate plugin.json + marketplace.json (valid JSON)
        run: |
          python3 -c "
          import json
          for p in ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json']:
              with open(p) as f:
                  json.load(f)
              print(f'✓ {p} is valid JSON')
          "

      - name: Validate version sync (plugin.json == marketplace.json plugin entry)
        run: |
          python3 -c "
          import json
          with open('.claude-plugin/plugin.json') as f:
              pj = json.load(f)
          with open('.claude-plugin/marketplace.json') as f:
              mj = json.load(f)
          plugin_v = pj['version']
          mp_v = mj['metadata']['version']
          mp_plugin_v = mj['plugins'][0]['version']
          assert plugin_v == mp_v == mp_plugin_v, f'version mismatch: plugin.json={plugin_v}, marketplace.metadata={mp_v}, marketplace.plugins[0]={mp_plugin_v}'
          print(f'✓ versions in sync: {plugin_v}')
          "

      - name: Validate SKILL.md frontmatter (all skills)
        run: |
          python3 -c "
          import re, yaml, sys, pathlib
          for sk in sorted(p.name for p in pathlib.Path('skills').iterdir() if p.is_dir()):
              content = open(f'skills/{sk}/SKILL.md').read()
              m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              assert m, f'skills/{sk}/SKILL.md missing YAML frontmatter'
              fm = yaml.safe_load(m.group(1))
              for k in ('name', 'description'):
                  assert k in fm, f'skills/{sk}/SKILL.md frontmatter missing key: {k}'
              assert fm['name'] == sk, f'skills/{sk}: frontmatter name={fm[\"name\"]} != dir name'
              print(f'✓ skills/{sk}/SKILL.md frontmatter OK')
          "

      - name: Validate referenced files exist (no dangling references)
        run: |
          python3 -c "
          import re, os, sys, pathlib
          errors = []
          total = 0
          for sk in sorted(p.name for p in pathlib.Path('skills').iterdir() if p.is_dir()):
              base = f'skills/{sk}/'
              for f in pathlib.Path(base).rglob('*.md'):
                  content = f.read_text()
                  # 负向后顾:跳过 \$DDR_SKILL/scripts/... 和 skills/ddr/scripts/... 这类跨 skill 引用,
                  # 只校验本 skill 内的相对引用
                  referenced = sorted(set(re.findall(r'(?<![/\w\\\"\$])(?:references|scripts|templates)/[\w\-/.]+\.(?:md|sh|py|html)', content)))
                  total += len(referenced)
                  for path in referenced:
                      if not os.path.exists(os.path.join(base, path)):
                          errors.append(f'  - {f}: references missing {path}')
          if errors:
              print('✗ Dangling references:')
              for e in errors:
                  print(e)
              sys.exit(1)
          print(f'✓ All {total} referenced paths resolve inside their own skill')
          "

      - name: Check no hardcoded user paths leaked
        # 排除 CONTRIBUTING.md — 它合法地需要在文档里提到这些 pattern
        run: |
          if grep -rn '/Users/\|/home/' skills/ README.md CHANGELOG.md 2>/dev/null; then
            echo '✗ Found hardcoded user paths above — please relativize'
            exit 1
          fi
          echo '✓ No hardcoded user paths'
